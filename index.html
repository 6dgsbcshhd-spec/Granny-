<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Бабка 3D — побег</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:Georgia,'Times New Roman',serif;color:#f4eefc;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:auto}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.88) 100%)}
#red{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 20%,#c00 140%);opacity:0}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;justify-content:space-between;font-size:16px;text-shadow:0 1px 3px #000;pointer-events:none}
#hud a{pointer-events:auto;color:#ff8fb1}
button{font:inherit;font-weight:700;background:#ff8fb1;color:#2a0f1b;border:0;border-radius:14px;padding:14px 22px}
button:focus-visible{outline:2px solid #7ee0c3;outline-offset:2px}
#hide{position:fixed;right:18px;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:none;padding:20px 22px}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;background:rgba(0,0,0,.85);font-size:28px;padding:24px}
#flash{position:fixed;top:38%;left:0;right:0;text-align:center;font-size:30px;color:#ff5b5b;text-shadow:0 2px 8px #000;display:none;pointer-events:none}
#jr{position:fixed;width:100px;height:100px;margin:-50px;border:3px solid rgba(255,255,255,.35);border-radius:50%;display:none;pointer-events:none}
#jk{position:fixed;width:36px;height:36px;margin:-18px;background:rgba(255,255,255,.4);border-radius:50%;display:none;pointer-events:none}
#menu{z-index:20;background:radial-gradient(ellipse at center,#2a1620,#000);font-size:16px}
.sc{display:none;flex-direction:column;gap:12px;align-items:center;width:min(340px,100%)}
.sc h1{margin:0;font-size:34px}.sc button,.sc select,.sc input{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:13px;border-radius:12px;border:0}
.sc select,.sc input{background:#2c2038;color:#f4eefc}.sc button.alt{background:#3b2c4d;color:#f4eefc}
.sc label{align-self:flex-start;font-size:14px;color:#a79bc4}.err{color:#ff6b6b;min-height:18px;font-size:14px}
.log{width:100%;height:150px;overflow:auto;text-align:left;font-size:14px;background:#0008;border-radius:10px;padding:8px;box-sizing:border-box}
.row{display:flex;gap:8px;width:100%}.row button{width:auto!important}
#gbar{position:fixed;top:calc(44px + env(safe-area-inset-top,0px));right:14px;display:none;gap:8px;z-index:5}#gbar button{padding:10px 14px}
#gchat{position:fixed;top:calc(44px + env(safe-area-inset-top,0px));left:10px;width:min(300px,78vw);display:none;z-index:5;flex-direction:column;gap:6px}
#gchat input{flex:1;min-width:0;font:inherit;padding:10px;border-radius:10px;border:0;background:#2c2038;color:#fff}
#menu{background:radial-gradient(ellipse at 60% 40%,#4a4a47 0%,#1c1b1a 55%,#050505 100%)}
#menu::before{content:"";position:absolute;left:38%;top:12%;width:26%;height:88%;border:14px solid #4a3220;border-bottom:0;background:linear-gradient(#0c0c0c,#1b1b1b);box-shadow:0 0 60px #000 inset}
#menu::after{content:"";position:absolute;left:44%;top:30%;width:14%;height:70%;background:radial-gradient(ellipse at 50% 8%,#d9d6d0 0 9%,transparent 10%),linear-gradient(#aaa9a4,#6d6c68);clip-path:polygon(30% 14%,70% 14%,88% 100%,12% 100%);opacity:.75}
#sc-main{width:100%;height:100%;position:relative;z-index:2;justify-content:center}
#mm{display:flex;width:100%;height:100%;align-items:center;justify-content:space-between;gap:16px;padding:0 6vw;box-sizing:border-box}
#mbtns{display:flex;flex-direction:column;gap:18px;width:min(280px,42vw)}
#mbtns button{background:#111c;color:#fff;border-radius:0;font:400 clamp(20px,5vw,34px)/1.1 Georgia,serif;letter-spacing:1px;padding:14px 10px;text-shadow:0 0 6px #000}
#mbtns button:active{background:#fff;color:#000}
#mtitle{font:400 clamp(44px,13vw,110px)/.95 Georgia,'Times New Roman',serif;letter-spacing:.06em;text-align:right;color:#f1ede6;text-shadow:3px 3px 0 #000,0 0 18px #000}
#mtitle small{display:block;font-size:.28em;letter-spacing:.2em;margin-top:10px}
@media(orientation:portrait){#menu{inset:auto;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}}
#menu .sc:not(#sc-main){background:#000b;padding:22px;border-radius:0;max-height:96%;overflow:auto;z-index:2;position:relative}
#menu .sc:not(#sc-main) button,#menu .sc:not(#sc-main) input,#menu .sc:not(#sc-main) select{border-radius:0}
</style>
</head>
<body>
<canvas id="cv"></canvas><div id="vig"></div><div id="red"></div>
<div id="hud"><span id="info"></span><a href="#" id="menuBtn">☰ Меню</a></div>
<div id="flash"></div><div id="jr"></div><div id="jk"></div>
<button id="hide">Спрятаться</button>
<div class="ov" id="msg"><div id="mt"></div></div>

<div class="ov" id="menu" style="display:flex;z-index:20">
<div class="sc" id="sc-main" style="display:flex"><div id="mm"><div id="mbtns">
<button id="b-play">НАЧАТЬ ИГРУ</button><button id="b-lob">СОЗДАТЬ ЛОБИ</button><button id="b-set">НАСТРОЙКИ</button><button id="b-upd">ПРЕДЛОЖЕНИЕ<br>ДЛЯ ОБНОВЛЕНИЯ</button></div>
<div id="mtitle">БАБКА<small>3D · ПОБЕГ</small></div></div></div>
<div class="sc" id="sc-set"><h1>⚙ Настройки</h1>
<label>Ник</label><input id="s-nick" maxlength="12" placeholder="Игрок">
<label>Сложность</label><select id="s-diff"><option value="0">Лёгкая</option><option value="1">Нормальная</option><option value="2">Кошмар</option></select>
<label>Чувствительность</label><input type="range" id="s-sens" min="0.4" max="2.5" step="0.1">
<label>Качество</label><select id="s-q"><option value="0">Низкое</option><option value="1">Среднее</option><option value="2">Высокое</option></select>
<button id="s-ok">Сохранить</button></div>
<div class="sc" id="sc-lob"><h1>👥 Лобби</h1><button id="b-create">➕ Создать лобби</button>
<label>Или введи ID комнаты</label><input id="rid" maxlength="5" placeholder="ID комнаты"><button id="b-join" class="alt">Войти</button><div class="err" id="lerr"></div><button class="alt back">← Назад</button></div>
<div class="sc" id="sc-room"><h1 id="rtitle"></h1><div id="rmem" style="color:#a79bc4"></div>
<div class="log" id="clog"></div><div class="row"><input id="cin" maxlength="200" placeholder="Сообщение"><button id="cs">➤</button></div>
<button id="vb" class="alt">🎤 Включить голосовой чат</button><button id="b-start">▶ Начать игру</button><button class="alt back">← Выйти</button></div>
</div>
<div id="gbar"><button id="gc">💬</button><button id="gv">🎤</button></div>
<div id="gchat"><div class="log" id="glog"></div><div class="row"><input id="gin" maxlength="200" placeholder="Чат"><button id="gs">➤</button></div></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,get,set,update,onValue,onDisconnect,runTransaction,push,onChildAdded,query,limitToLast,remove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const db = getDatabase(initializeApp({databaseURL:"https://shsj-66355-default-rtdb.firebaseio.com",projectId:"shsj-66355"}));
const MAP = [
"#####################",
"#P.....#.....#.....K#",
"#..H...#..H..#...H..#",
"#......#.....#......#",
"###.#####.#####.#####",
"#...................#",
"#.#####.#####.#####.#",
"#.#K..#.#...#.#..H#.#",
"#.#...#.#.H.#.#...#.#",
"#.#...#.#...#.#..K#.#",
"#.##.##.##.##.##.##.#",
"#...................E",
"#####################"];
const W=21,H=13,NEED=3,DAYS=5,START=[1.5,1.5],GS=[10.5,5.5];
const KEYS=[[19,1],[3,7],[17,9]];
const HS=[]; MAP.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==="H")HS.push([x+.5,y+.5])}));
const $=s=>document.querySelector(s);
const S=Object.assign({diff:1,sens:1,q:2,nick:""},JSON.parse(localStorage.getItem("gs")||"{}"));
const DFs=[{s:.8,r:7},{s:1,r:10},{s:1.3,r:13}];let DF=DFs[S.diff];
let GP=null,R=null,playing=false,owner=false,ms=null;const pcs={};
const show=id=>document.querySelectorAll(".sc").forEach(e=>e.style.display=e.id===id?"flex":"none");
const rid=()=>Math.random().toString(36).slice(2,7).toUpperCase().replace(/[O0I1L]/g,"X");
const setRoom=id=>{R="rooms/"+id;GP=R+"/g";$("#rtitle").textContent="Комната: "+id};
const lerr=t=>$("#lerr").textContent=t;
function applyQ(){renderer.setPixelRatio([.7,1,Math.min(devicePixelRatio,1.5)][S.q]);moon.castShadow=S.q>0;resize()}
$("#b-set").onclick=()=>{$("#s-nick").value=S.nick;$("#s-diff").value=S.diff;$("#s-sens").value=S.sens;$("#s-q").value=S.q;show("sc-set")};
$("#s-ok").onclick=()=>{S.nick=$("#s-nick").value.trim();S.diff=+$("#s-diff").value;S.sens=+$("#s-sens").value;S.q=+$("#s-q").value;DF=DFs[S.diff];localStorage.setItem("gs",JSON.stringify(S));applyQ();show("sc-main")};
document.querySelectorAll(".back").forEach(b=>b.onclick=()=>location.reload());
$("#b-lob").onclick=()=>{lerr("");show("sc-lob")};
$("#b-upd").onclick=()=>window.open("https://t.me/akselovvv","_blank");
$("#menuBtn").onclick=e=>{e.preventDefault();location.reload()};
const nick=()=>{name=S.nick||"Игрок"+Math.floor(Math.random()*90+10)};
$("#b-play").onclick=()=>{nick();setRoom(rid());startGame()};
$("#b-create").onclick=async()=>{nick();const id=rid();setRoom(id);owner=true;
  try{await set(ref(db,R+"/meta"),{host:me});await set(ref(db,R+"/members/"+me),name);enter()}catch(e){lerr("Ошибка сети: "+e.message)}};
$("#b-join").onclick=async()=>{const id=$("#rid").value.trim().toUpperCase();if(!id)return;nick();lerr("Подключаюсь…");
  try{const m=await get(ref(db,"rooms/"+id+"/meta"));if(!m.exists())return lerr("Комната не найдена");
  setRoom(id);const r=await runTransaction(ref(db,R+"/members"),c=>{c=c||{};if(!c[me]&&Object.keys(c).length>=3)return;c[me]=name;return c});
  if(!r.committed)return lerr("Лобби заполнено (макс. 3)");owner=m.val().host===me;enter()}catch(e){lerr("Ошибка сети: "+e.message)}};
function enter(){onDisconnect(ref(db,R+"/members/"+me)).remove();show("sc-room");
  $("#b-start").style.display=owner?"block":"none";
  onValue(ref(db,R+"/members"),s=>{const v=Object.values(s.val()||{});$("#rmem").textContent="Игроки "+v.length+"/3: "+v.join(", ")});
  onValue(ref(db,R+"/started"),s=>{if(s.val()&&!playing)startGame()});
  onChildAdded(query(ref(db,R+"/chat"),limitToLast(40)),s=>addMsg(s.val()))}
$("#b-start").onclick=()=>set(ref(db,R+"/started"),true);
function startGame(){try{const d=document.documentElement;(d.requestFullscreen?d.requestFullscreen():Promise.resolve()).then(()=>screen.orientation.lock("landscape")).catch(()=>{})}catch(e){}playing=true;$("#menu").style.display="none";$("#gbar").style.display="flex";startAudio();startNet()}
/* чат */
function addMsg(m){for(const id of["#clog","#glog"]){const l=$(id),d=document.createElement("div");d.textContent=m.n+": "+m.m;l.appendChild(d);l.scrollTop=1e9}
  if(playing&&$("#gchat").style.display!=="flex"&&m.n!==name)say("💬 "+m.n+": "+m.m,2500)}
const sendMsg=i=>{const t=$(i).value.trim();if(!t||!R)return;$(i).value="";push(ref(db,R+"/chat"),{n:name,m:t.slice(0,200)})};
for(const[b,i]of[["#cs","#cin"],["#gs","#gin"]]){$(b).onclick=()=>sendMsg(i);$(i).addEventListener("keydown",e=>{if(e.key==="Enter")sendMsg(i)})}
$("#gc").onclick=()=>{const c=$("#gchat");c.style.display=c.style.display==="flex"?"none":"flex"};
/* голос: WebRTC, сигналы идут через Firebase */
const sig=(to,d)=>push(ref(db,R+"/sig/"+to),{f:me,...d});
function mk(id){const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]});
  ms.getTracks().forEach(t=>pc.addTrack(t,ms));pc.onicecandidate=e=>e.candidate&&sig(id,{c:e.candidate.toJSON()});
  pc.ontrack=e=>{let a=document.getElementById("a"+id);if(!a){a=document.createElement("audio");a.id="a"+id;a.autoplay=true;document.body.appendChild(a)}a.srcObject=e.streams[0]};
  return pcs[id]=pc}
async function handle(m){let pc=pcs[m.f];
  if(m.d){if(m.d.type==="offer"){pc=pc||mk(m.f);await pc.setRemoteDescription(m.d);const a=await pc.createAnswer();await pc.setLocalDescription(a);sig(m.f,{d:pc.localDescription.toJSON()})}else if(pc)await pc.setRemoteDescription(m.d)}
  else if(m.c&&pc)try{await pc.addIceCandidate(m.c)}catch(e){}}
async function voice(){
  if(ms){location.reload();return}
  try{ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){say("Нет доступа к микрофону",2500);return}
  for(const id of["#vb","#gv"])$(id).textContent=id==="#vb"?"🔇 Выключить голосовой чат":"🔊";
  await remove(ref(db,R+"/sig/"+me));
  onChildAdded(ref(db,R+"/sig/"+me),s=>{const m=s.val();remove(s.ref);handle(m)});
  onValue(ref(db,R+"/voice"),s=>{const v=s.val()||{};
    for(const id in v)if(id!==me&&!pcs[id]&&me<id){const pc=mk(id);pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>sig(id,{d:pc.localDescription.toJSON()}))}
    for(const id in pcs)if(!v[id]){pcs[id].close();delete pcs[id]}});
  set(ref(db,R+"/voice/"+me),1);onDisconnect(ref(db,R+"/voice/"+me)).remove()}
$("#vb").onclick=voice;$("#gv").onclick=voice;


let me=localStorage.getItem("me")||"g"+Math.random().toString(36).slice(2,7), name="Игрок";
get(ref(db,"users/"+me+"/name")).then(s=>{if(s.exists())name=s.val()}).catch(()=>{});
let off=0; onValue(ref(db,".info/serverTimeOffset"),s=>off=s.val()||0);
const now=()=>Date.now()+off;
let G={players:{},keys:{},granny:null,won:null,stun:0,day:1}, wasWon=false, lastDay=1, lastC=0;
const p={x:START[0],y:START[1],a:.5,h:false}, gr={x:GS[0],y:GS[1]};
const fresh=()=>Object.entries(G.players).filter(([i,v])=>now()-v.t<4000);
const keysN=()=>Object.keys(G.keys).length;
const isHost=()=>[...fresh().map(e=>e[0]).filter(i=>i!==me),me].sort()[0]===me;
const reset=()=>update(ref(db,GP),{keys:null,won:null,stun:null,day:1});
const say=(t,ms)=>{const f=$("#flash");f.textContent=t;f.style.display="block";setTimeout(()=>f.style.display="none",ms||1800)};

function startNet(){onValue(ref(db,GP),s=>{
  const v=s.val()||{}, pc=G.granny&&G.granny.c;
  G={players:v.players||{},keys:v.keys||{},granny:v.granny||null,won:v.won||null,stun:v.stun||0,day:v.day||1};
  if(G.granny&&G.granny.c&&!pc&&Math.hypot(G.granny.x-p.x,G.granny.y-p.y)<12){tone(100,1.2,"sawtooth",.25,45);noise(.6,.2,500)}
  if(G.day>DAYS&&isHost()){reset()}
  if(G.day<lastDay&&!G.won){p.x=START[0];p.y=START[1];p.h=false;say("Дни кончились. Всё заново…",3000)}
  lastDay=G.day;
  if(G.won&&!wasWon){
    wasWon=true;$("#mt").textContent="🎉 Вы сбежали! +50 🪙";$("#msg").style.display="flex";
    tone(523,.4,"triangle",.3);setTimeout(()=>tone(784,.6,"triangle",.3),250);
    if(localStorage.getItem("win")!==String(G.won.t)){
      localStorage.setItem("win",String(G.won.t));
      if(localStorage.getItem("me"))runTransaction(ref(db,"users/"+me+"/coins"),c=>(c||0)+50);
    }
    setTimeout(()=>{if(G.won)reset()},7000+Math.random()*1000);
  }
  if(!G.won&&wasWon){wasWon=false;$("#msg").style.display="none";p.x=START[0];p.y=START[1];p.h=false;gr.x=GS[0];gr.y=GS[1]}
  $("#info").textContent="День "+Math.min(G.day,DAYS)+"/"+DAYS+" · 🗝 "+keysN()+"/"+NEED+" · 👥 "+fresh().length;
});
onDisconnect(ref(db,GP+"/players/"+me)).remove();}

/* ---------- звук (всё синтезируется, файлов нет) ---------- */
let ac,mg;
function startAudio(){
  if(ac)return; ac=new (window.AudioContext||window.webkitAudioContext)(); mg=ac.createGain(); mg.gain.value=.8; mg.connect(ac.destination);
  const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=140;
  const dg=ac.createGain(); dg.gain.value=.07; lp.connect(dg); dg.connect(mg);
  [55,58.3].forEach(f=>{const o=ac.createOscillator();o.type="sawtooth";o.frequency.value=f;o.connect(lp);o.start()});
}
function tone(f,d,type,v,to){
  if(!ac)return; const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t); if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(Math.max(.002,v),t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g); g.connect(mg); o.start(t); o.stop(t+d);
}
function noise(d,v,fq,pan){
  if(!ac)return; const n=ac.sampleRate*d|0,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),pn=ac.createStereoPanner?ac.createStereoPanner():null;
  s.buffer=b; f.type="lowpass"; f.frequency.value=fq; g.gain.setValueAtTime(Math.max(.002,v),ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  s.connect(f); f.connect(g); if(pn){pn.pan.value=pan||0;g.connect(pn);pn.connect(mg)}else g.connect(mg); s.start();
}


/* ---------- карта, движение, бабка ---------- */
const tile=(x,y)=>(MAP[y]||"")[x]??"#";
const solid=(x,y)=>{const c=tile(Math.floor(x),Math.floor(y));return c==="#"||(c==="E"&&keysN()<NEED)};
function move(dx,dy){
  const r=.25;
  for(const [ax,ay] of [[dx,0],[0,dy]]){
    const nx=p.x+ax,ny=p.y+ay;
    if(![[-r,-r],[r,-r],[-r,r],[r,r]].some(([a,b])=>solid(nx+a,ny+b))){p.x=nx;p.y=ny}
  }
}
function path(sx,sy,tx,ty){
  const k=(x,y)=>y*W+x,prev=new Map([[k(sx,sy),-1]]),q=[[sx,sy]];
  while(q.length){
    const [x,y]=q.shift(); if(x===tx&&y===ty)break;
    for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+a,ny=y+b,t=tile(nx,ny);
      if(t==="#"||t==="E"||prev.has(k(nx,ny)))continue;
      prev.set(k(nx,ny),k(x,y)); q.push([nx,ny]);
    }
  }
  if(!prev.has(k(tx,ty)))return null;
  let c=k(tx,ty); const r=[]; while(c!==-1){r.push([c%W,(c/W)|0]);c=prev.get(c)} return r.reverse();
}
let route=null,chase=0,acc=0;
function randomRoute(){
  for(let i=0;i<30;i++){
    const x=1+(Math.random()*(W-2)|0),y=1+(Math.random()*(H-2)|0);
    if(tile(x,y)==="."){const r=path(gr.x|0,gr.y|0,x,y);if(r&&r.length>1)return r}
  }
  return null;
}
function grannyStep(dt){
  if(now()<G.stun)return;
  acc-=dt;
  if(acc<=0){
    acc=.3; let best=null,bl=99;
    for(const [i,v] of fresh()){
      if(v.h)continue;
      const r=path(gr.x|0,gr.y|0,v.x|0,v.y|0);
      if(r&&r.length<bl){bl=r.length;best=r}
    }
    if(best&&bl<=DF.r){route=best;chase=1}
    else if(chase||!route||route.length<2){chase=0;route=randomRoute()}
  }
  if(route&&route.length>1){
    const [tx,ty]=route[1],dx=tx+.5-gr.x,dy=ty+.5-gr.y,d=Math.hypot(dx,dy),sp=(chase?1.9+.25*G.day:1.2)*DF.s*dt;
    if(d<=sp){gr.x=tx+.5;gr.y=ty+.5;route.shift()}else{gr.x+=dx/d*sp;gr.y+=dy/d*sp}
  }
}

/* ---------- управление ---------- */
const kd={}; let mv=null,lk=null,near=null;
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;kd[e.key.toLowerCase()]=1;if(e.key==="e")toggleHide()});
addEventListener("keyup",e=>delete kd[e.key.toLowerCase()]);
const cv=$("#cv");
cv.addEventListener("click",()=>{if(cv.requestPointerLock&&!("ontouchstart" in window))cv.requestPointerLock()});
addEventListener("mousemove",e=>{if(document.pointerLockElement)p.a+=e.movementX*.003*S.sens});
cv.addEventListener("touchstart",e=>{
  for(const t of e.changedTouches){
    if(t.clientX<innerWidth/2&&!mv){mv={id:t.identifier,ox:t.clientX,oy:t.clientY,dx:0,dy:0};
      for(const id of ["jr","jk"]){const el=$("#"+id);el.style.display="block";el.style.left=t.clientX+"px";el.style.top=t.clientY+"px"}}
    else if(!lk)lk={id:t.identifier,x:t.clientX};
  }
  e.preventDefault();
},{passive:false});
cv.addEventListener("touchmove",e=>{
  for(const t of e.changedTouches){
    if(mv&&t.identifier===mv.id){let dx=(t.clientX-mv.ox)/50,dy=(t.clientY-mv.oy)/50,l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}mv.dx=dx;mv.dy=dy;
      $("#jk").style.left=mv.ox+dx*50+"px";$("#jk").style.top=mv.oy+dy*50+"px"}
    if(lk&&t.identifier===lk.id){p.a+=(t.clientX-lk.x)*.007*S.sens;lk.x=t.clientX}
  }
  e.preventDefault();
},{passive:false});
const tend=e=>{for(const t of e.changedTouches){
  if(mv&&t.identifier===mv.id){mv=null;$("#jr").style.display=$("#jk").style.display="none"}
  if(lk&&t.identifier===lk.id)lk=null}};
cv.addEventListener("touchend",tend); cv.addEventListener("touchcancel",tend);
function toggleHide(){if(p.h){p.h=false;noise(.2,.2,600)}else if(near){p.h=true;p.x=near[0];p.y=near[1];noise(.2,.2,600)}}
$("#hide").onclick=toggleHide;

/* ---------- НАСТОЯЩАЯ 3D-СЦЕНА НА THREE.JS ---------- */
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x090607); scene.fog=new THREE.FogExp2(0x090607,.065);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.06,55); camera.position.set(p.x,1.55,p.y);
scene.add(new THREE.HemisphereLight(0x9a8794,0x160b08,1.05));
const moon=new THREE.DirectionalLight(0x9aa6bd,.7); moon.position.set(-8,14,5); moon.castShadow=true; moon.shadow.mapSize.set(1024,1024); scene.add(moon);
const playerLamp=new THREE.PointLight(0xffd7a1,2.0,8,2); camera.add(playerLamp); scene.add(camera);
const mat=(color,roughness=1,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const wallMat=mat(0x403331),wallAlt=mat(0x292324),floorMat=mat(0x211918),ceilingMat=mat(0x100d0e),darkMat=mat(0x090708);
const box=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o};
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W, H),floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(W/2,0,H/2);floor.receiveShadow=true;scene.add(floor);
const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(W,H),ceilingMat);ceiling.rotation.x=Math.PI/2;ceiling.position.set(W/2,3.35,H/2);scene.add(ceiling);
// Стены лабиринта строятся прямо из твоей карты MAP.
MAP.forEach((row,y)=>[...row].forEach((c,x)=>{if(c==="#")box(1,3.35,1,(x+y)%2?wallMat:wallAlt,x+.5,1.675,y+.5)}));
// Холодные лампы в коридорах.
[[3,2],[10,5],[17,3],[5,11],[15,11]].forEach(([x,z])=>{const l=new THREE.PointLight(0x8d6570,1.1,5,2);l.position.set(x,2.8,z);scene.add(l);box(.18,.06,.18,mat(0x80636a),x,3.25,z)});
// Дверь выхода.
const exitDoor=box(.12,2.6,.95,mat(0x50351f),20.48,1.3,11.5); const exitGlow=new THREE.PointLight(0xffa34b,1.4,4);exitGlow.position.set(19.8,2,11.5);scene.add(exitGlow);
// Прячущие шкафы.
const hideMeshes=[]; HS.forEach(([x,z])=>{const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const body=new THREE.Mesh(new THREE.BoxGeometry(.78,2.35,.65),mat(0x38251e));body.position.y=1.175;body.castShadow=true;g.add(body);const door=new THREE.Mesh(new THREE.BoxGeometry(.7,2.2,.05),mat(0x52372b));door.position.set(0,1.15,.35);g.add(door);hideMeshes.push(g)});
// Ключи.
const keyMeshes=KEYS.map(([x,z])=>{const g=new THREE.Group();g.position.set(x+.5,.65,z+.5);scene.add(g);const ring=new THREE.Mesh(new THREE.TorusGeometry(.16,.035,8,20),mat(0xd6a94c,.35,.65));g.add(ring);const stem=box(.07,.34,.07,mat(0xd6a94c,.35,.65),0,0,0);stem.position.set(.19,-.15,0);g.add(stem);return g});
// Процедурная модель жуткой старухи: тело, платье, руки, седые волосы и светящиеся глаза.
function makeGranny(){const root=new THREE.Group();const skin=mat(0x9a8b80),dress=mat(0x382b30),cloth=mat(0x514047),hair=mat(0xaaa6a0),black=mat(0x080607),eye=new THREE.MeshStandardMaterial({color:0xe8e6d9,emissive:0xb9b5a8,emissiveIntensity:1.8});
const ell=(m,x,y,z,sx,sy,sz)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;root.add(o);return o};
const cone=(m,x,y,z,r1,r2,h)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),m);o.position.set(x,y,z);o.castShadow=true;root.add(o);return o};
cone(dress,0,1.02,0,.27,.48,1.35);ell(skin,0,1.82,0,.19,.24,.18);ell(hair,0,2.02,-.015,.22,.18,.21);ell(hair,-.19,1.91,0,.08,.25,.09);ell(hair,.19,1.91,0,.08,.25,.09);
// лицо и глаза направлены вперёд по локальной оси -Z
ell(skin,0,1.82,-.155,.15,.18,.07);ell(black,-.065,1.87,-.218,.045,.035,.018);ell(black,.065,1.87,-.218,.045,.035,.018);ell(eye,-.065,1.87,-.235,.019,.021,.012);ell(eye,.065,1.87,-.235,.019,.021,.012);ell(black,0,1.76,-.222,.07,.018,.018);
for(let i=0;i<7;i++){const a=(i/6-.5)*1.7;ell(hair,Math.sin(a)*.18,2.12+Math.cos(a)*.035,-.02+Math.cos(a)*.08,.045,.22,.045)}
for(const side of [-1,1]){const arm=cone(skin,side*.34,1.25,-.015,.075,.09,.72);arm.rotation.z=side*.22;ell(skin,side*.39,.86,-.06,.08,.12,.07);cone(dress,side*.12,.27,0,.09,.11,.5)}
// длинная трость
const cane= new THREE.Mesh(new THREE.CylinderGeometry(.025,.03,.95,8),mat(0x24160f));cane.position.set(.52,.55,-.02);root.add(cane);return root}
const grannyModel=makeGranny();scene.add(grannyModel);
const otherModels=new Map();
function makeOther(id,n){const g=new THREE.Group();let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;
const hm=mat(new THREE.Color().setHSL(h/360,.55,.4).getHex()),sk=mat(0xd9b79c),dk=mat(0x1d2330);
const add=(geo,m,x,y,z,P=g)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;P.add(o);return o};
add(new THREE.BoxGeometry(.4,.55,.22),hm,0,1.05,0);add(new THREE.SphereGeometry(.15,14,12),sk,0,1.5,0);
add(new THREE.SphereGeometry(.157,14,8,0,Math.PI*2,0,Math.PI/2),mat(0x2b1d14),0,1.52,-.01);
for(const x of[-.055,.055])add(new THREE.SphereGeometry(.02,8,8),mat(0x050505),x,1.51,.14);
const lim=(x,y,w,l,m)=>{const p=new THREE.Group();p.position.set(x,y,0);g.add(p);add(new THREE.BoxGeometry(w,l,w),m,0,-l/2,0,p);return p};
const L=[lim(-.1,.78,.15,.78,dk),lim(.1,.78,.15,.78,dk)],A=[lim(-.27,1.3,.1,.5,hm),lim(.27,1.3,.1,.5,hm)];
const c=document.createElement("canvas");c.width=256;c.height=64;const x=c.getContext("2d");x.font="bold 34px sans-serif";x.textAlign="center";x.fillStyle="#fff";x.strokeStyle="#000";x.lineWidth=5;x.strokeText(n,128,44);x.fillText(n,128,44);
const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));sp.position.y=1.95;sp.scale.set(1.1,.28,1);g.add(sp);
g.userData={L,A,ph:0};return g}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
function render(){camera.position.set(p.x,1.52,p.y);camera.rotation.order="YXZ";camera.rotation.y=-p.a-Math.PI/2;camera.rotation.x=0;
 grannyModel.position.set(gr.x,0,gr.y);grannyModel.rotation.y=Math.atan2(p.x-gr.x,p.y-gr.y);grannyModel.scale.setScalar(1+Math.sin(performance.now()*.004)*.012);
 keyMeshes.forEach((k,i)=>{k.visible=!G.keys[i];k.rotation.y+=.025;k.position.y=.65+Math.sin(performance.now()*.003+i)*.08});
 hideMeshes.forEach((g,i)=>{g.rotation.y=0});
 for(const [id,v] of fresh()){if(id===me)continue;let o=otherModels.get(id);if(!o){o=makeOther(id,v.n||"Друг");scene.add(o);o.position.set(v.x,0,v.y);otherModels.set(id,o)}
 const u=o.userData,dx=v.x-o.position.x,dz=v.y-o.position.z,d=Math.hypot(dx,dz);o.position.x+=dx*.25;o.position.z+=dz*.25;
 if(d>.01){const ta=Math.atan2(dx,dz);o.rotation.y+=Math.atan2(Math.sin(ta-o.rotation.y),Math.cos(ta-o.rotation.y))*.2;u.ph+=d*9}
 const w=Math.min(1,d*20)*.8*Math.sin(u.ph);u.L[0].rotation.x=w;u.L[1].rotation.x=-w;u.A[0].rotation.x=-w;u.A[1].rotation.x=w;o.visible=!v.h}
 for(const [id,o] of otherModels)if(!G.players[id]||now()-G.players[id].t>=4000){scene.remove(o);otherModels.delete(id)}
 renderer.render(scene,camera)}

/* ---------- цикл ---------- */
let last=performance.now(),sendT=0,stepT=0,gStepT=0,beatT=0;
function caught(){
  lastC=now(); p.x=START[0];p.y=START[1];p.h=false;
  set(ref(db,GP+"/stun"),now()+3000);
  runTransaction(ref(db,GP+"/day"),d=>(d||1)+1);
  noise(.8,.7,2500);tone(900,.7,"sawtooth",.3,90);navigator.vibrate&&navigator.vibrate(300);
  say("👵 Бабка поймала! Новый день…",2200);
}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!G.won&&GP){
    let moving=false;
    if(!p.h){
      let dx=(kd.d||kd.arrowright?1:0)-(kd.a||kd.arrowleft?1:0),dy=(kd.s||kd.arrowdown?1:0)-(kd.w||kd.arrowup?1:0);
      if(kd.q)p.a-=2*dt; if(kd.e&&0)p.a+=2*dt;
      if(mv){dx=mv.dx;dy=mv.dy}
      const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
      if(l>.15){
        moving=true;
        const c=Math.cos(p.a),s=Math.sin(p.a),f=-dy*2.6*dt,sd=dx*2.6*dt;
        move(c*f-s*sd,s*f+c*sd);
      }
    }
    near=HS.find(([x,y])=>Math.hypot(x-p.x,y-p.y)<.9)||null;
    $("#hide").style.display=(near||p.h)?"block":"none"; $("#hide").textContent=p.h?"Выйти":"Спрятаться";
    if(isHost())grannyStep(dt);
    else if(G.granny){const k=Math.min(1,dt*10);gr.x+=(G.granny.x-gr.x)*k;gr.y+=(G.granny.y-gr.y)*k}
    KEYS.forEach(([x,y],i)=>{if(!G.keys[i]&&Math.hypot(x+.5-p.x,y+.5-p.y)<.6){G.keys[i]=true;set(ref(db,GP+"/keys/"+i),true);tone(1200,.3,"triangle",.3);setTimeout(()=>tone(1600,.4,"triangle",.3),120)}});
    const d=Math.hypot(gr.x-p.x,gr.y-p.y);
    if(!p.h&&d<.7&&now()-lastC>3000)caught();
    if(tile(p.x|0,p.y|0)==="E"&&keysN()>=NEED)set(ref(db,GP+"/won"),{by:name,t:now()});
    /* звуки */
    stepT-=dt; if(moving&&stepT<=0){stepT=.45;noise(.08,.18,420)}
    gStepT-=dt; if(d<9&&gStepT<=0){gStepT=chase||(G.granny&&G.granny.c)?.4:.7;noise(.12,Math.max(.01,(1-d/9)*.7),260,Math.sin(Math.atan2(gr.y-p.y,gr.x-p.x)-p.a))}
    beatT-=dt; if(d<7&&beatT<=0){beatT=.35+d*.12;tone(65,.18,"sine",.9-d/9,38);setTimeout(()=>tone(60,.15,"sine",.5-d/16,35),170)}
    $("#red").style.opacity=d<5?(1-d/5)*.8:0;
  }
  sendT-=dt;
  if(sendT<=0&&GP&&playing){
    sendT=.1;
    set(ref(db,GP+"/players/"+me),{x:+p.x.toFixed(2),y:+p.y.toFixed(2),h:p.h?1:0,n:name,t:now()});
    if(isHost())set(ref(db,GP+"/granny"),{x:+gr.x.toFixed(2),y:+gr.y.toFixed(2),c:chase});
  }
  render(); requestAnimationFrame(loop);
}
applyQ();requestAnimationFrame(loop);
